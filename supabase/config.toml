project_id = "cypressdale-member-hub"
[api]
enabled = true
port = 55421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55422
shadow_port = 55420
major_version = 17
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
[realtime]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 55424
[storage]
enabled = true
file_size_limit = "50MiB"
[auth]
enabled = true
site_url = "http://localhost:3002"
additional_redirect_urls = ["http://localhost:3002/auth/confirm", "http://127.0.0.1:3002/auth/confirm"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"
[auth.email.template.confirmation]
subject = "Confirm your Cypressdale HOA account"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Reset your Cypressdale HOA password"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.invite]
subject = "Your Cypressdale HOA admin invitation"
content_path = "./supabase/templates/invite.html"
[auth.email.template.magic_link]
subject = "Sign in to Cypressdale HOA"
content_path = "./supabase/templates/magic-link.html"
[analytics]
enabled = false
[edge_runtime]
enabled = false
